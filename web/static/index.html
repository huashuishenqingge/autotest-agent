<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoTest Agent 任务中心</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><body><header><p>软件工程实践 · AutoTest Agent</p><h1>测试与修复任务中心</h1><p id="mode">正在连接本机服务…</p></header><main><section><h2>创建任务</h2><form id="create"><label for="case">已审核的边界缺陷任务</label><select id="case" required></select><button id="submit">提交任务</button></form><p>任务串行运行。取消在阶段边界生效，正在进行的模型请求或容器测试可能仍需等待。</p><p id="message" role="status"></p></section><div class="workspace"><section><h2>任务列表</h2><div id="tasks"></div></section><section id="detail"><h2>任务详情</h2><p id="summary">选择任务查看执行记录</p><div class="actions"><button id="cancel" disabled>取消任务</button><a id="download" hidden>下载任务 JSON</a></div><h3>覆盖率对比</h3><div id="coverage"></div><h3>反馈子任务</h3><pre id="feedback">暂无反馈子任务</pre><h3>状态与执行日志</h3><pre id="logs">暂无记录</pre><h3>生成测试</h3><pre id="tests">暂无记录</pre><h3>诊断与补丁差异</h3><pre id="patch">暂无记录</pre><details><summary>完整任务结果</summary><pre id="raw">{}</pre></details></section></div></main><footer>本机任务工作区 · 页面不会要求输入模型密钥</footer></body></html>
